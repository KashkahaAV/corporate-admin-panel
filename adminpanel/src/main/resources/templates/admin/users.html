<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <!-- Подключаем Bootstrap для красивого и быстрого оформления -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🛡️ Управление корпоративными пользователями</h2>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger btn-sm">Выйти</button>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Логин</th>
                    <th>Email</th>
                    <th>Статус</th>
                    <th>Действие</th>
                </tr>
                </thead>
                <tbody>
                <!-- Цикл по списку пользователей, пришедших из контроллера -->
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.username}">john_doe</td>
                    <td th:text="${user.email}">john@corporate.com</td>
                    <td>
                        <span th:if="${user.active}" class="badge bg-success">Активен</span>
                        <span th:unless="${user.active}" class="badge bg-secondary">Заблокирован</span>
                    </td>
                    <td>

                        <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-warning">
                                Сменить статус
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
